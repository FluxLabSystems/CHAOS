# Homestead Digital Twin -- continuous integration.
#
# Requires no secrets: everything runs against SQLite and the in-memory message
# bus, which is deliberate. The platform must be exercisable end to end without
# PostgreSQL, without Mosquitto and without the property (SDD sections 5.1 and
# 19 step 1, bench test). If a change breaks that, CI is where it should hurt.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # The design package is the contract. If it does not validate, nothing that
  # loads it can be trusted, so this gates everything else.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate design package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate schemas and cross-references
        # --no-report keeps CI read-only: the tracked report carries a
        # timestamp, so writing it would leave every run with a dirty tree.
        run: python tools/validate_bundle.py --no-report

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the container image and the shipped Windows runtime
        # run; 3.12 and 3.13 are the lines the runtime lock file says it
        # should move to once the suite is green on them, which this proves.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      # The CLI is the operator's interface on a node with no browser. These are
      # the invocations a person types during a black start, so they are checked
      # as installed console scripts, not only through the test suite.
      - name: Smoke-test the installed CLI
        run: |
          set -eux
          chaos --version
          chaos --help
          chaos validate
          chaos plugins
          chaos-simulator --list-scenarios
          chaos --database-url "sqlite:///$RUNNER_TEMP/ci.db" init-db
          # init-db records the schema revision, so migrate must find nothing to do.
          # (Output goes to a file first: a CLI failure must not hide behind grep's exit code.)
          chaos --database-url "sqlite:///$RUNNER_TEMP/ci.db" migrate > "$RUNNER_TEMP/migrate.txt"
          grep -q 'already at head' "$RUNNER_TEMP/migrate.txt"
          # And on an empty database migrate alone must build the whole schema.
          chaos --database-url "sqlite:///$RUNNER_TEMP/migrated.db" migrate
          chaos --database-url "sqlite:///$RUNNER_TEMP/migrated.db" status --json > "$RUNNER_TEMP/migrated.json"
          grep -q '"missing_tables": \[\]' "$RUNNER_TEMP/migrated.json"
          chaos --database-url "sqlite:///$RUNNER_TEMP/ci.db" load-registry
          chaos --database-url "sqlite:///$RUNNER_TEMP/ci.db" status --json
          chaos --database-url "sqlite:///$RUNNER_TEMP/ci.db" export \
            --include registry --output "$RUNNER_TEMP/export.json"
          chaos --database-url "sqlite:///$RUNNER_TEMP/ci.db" backup \
            --output "$RUNNER_TEMP/backup.tar.gz"
          test -s "$RUNNER_TEMP/export.json"
          tar tzf "$RUNNER_TEMP/backup.tar.gz" | grep -q '^manifest.json$'
          # A restore dry run validates the archive against an empty database and writes nothing.
          chaos --database-url "sqlite:///$RUNNER_TEMP/restore.db" init-db
          chaos --database-url "sqlite:///$RUNNER_TEMP/restore.db" restore --dry-run "$RUNNER_TEMP/backup.tar.gz" \
            > "$RUNNER_TEMP/restore.txt"
          grep -q 'nothing written' "$RUNNER_TEMP/restore.txt"

      - name: Fail on an unknown subcommand
        run: |
          set +e
          chaos definitely-not-a-command >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo "an unknown subcommand must exit non-zero"; exit 1; }

  # ---------------------------------------------------------------------------
  # Deployment artefacts are configuration, and configuration that has never
  # been parsed is a guess.
  # ---------------------------------------------------------------------------
  deploy-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6.0"

      - name: Validate compose files
        run: |
          set -eux
          # Placeholder values only. Every required variable is listed in
          # deploy/.env.example; a new one that is not set here will fail here,
          # which is the point.
          cat > deploy/.env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-placeholder
          POSTGRES_DB=homestead
          CHAOS_MQTT_USERNAME=ci-twin
          CHAOS_MQTT_PASSWORD=ci-placeholder
          GRAFANA_ADMIN_PASSWORD=ci-placeholder
          SECONDARY_POSTGRES_PASSWORD=ci-placeholder-2
          SECONDARY_MQTT_USERNAME=ci-twin-secondary
          SECONDARY_MQTT_PASSWORD=ci-placeholder-2
          SECONDARY_GRAFANA_ADMIN_PASSWORD=ci-placeholder-2
          EOF
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
          docker compose -f deploy/docker-compose.secondary.yml --env-file deploy/.env config -q
          rm -f deploy/.env

      - name: Parse Grafana and Prometheus configuration
        run: |
          python - <<'PY'
          import json, pathlib, sys, yaml

          failures = []
          for path in sorted(pathlib.Path("deploy").rglob("*.yml")):
              if "docker-compose" in path.name:
                  continue
              try:
                  yaml.safe_load(path.read_text())
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for path in sorted(pathlib.Path("deploy/grafana/dashboards").glob("*.json")):
              try:
                  dash = json.loads(path.read_text())
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  continue
              for key in ("uid", "title", "panels"):
                  if key not in dash:
                      failures.append(f"{path}: dashboard is missing '{key}'")
              seen = set()
              for panel in dash.get("panels", []):
                  pid = panel.get("id")
                  if pid in seen:
                      failures.append(f"{path}: duplicate panel id {pid}")
                  seen.add(pid)

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("deployment configuration parses")
          PY

      - name: Check shell scripts
        run: |
          set -eux
          sh -n deploy/backup/backup.sh
          test -x deploy/backup/backup.sh

      - name: Refuse committed secrets
        run: |
          set -eu
          if [ -f deploy/.env ]; then
            echo "deploy/.env must never be committed -- it holds live credentials."
            exit 1
          fi
          # Placeholders in .env.example are fine; anything that looks like a
          # real value is not. Commented lines are ignored by the ^[A-Z_] anchor.
          offenders=$(grep -E '^[A-Z_]+(PASSWORD|SECRET|TOKEN)=' deploy/.env.example \
                        | grep -v 'CHANGE_ME' || true)
          if [ -n "$offenders" ]; then
            echo "deploy/.env.example must contain CHANGE_ME placeholders only:"
            echo "$offenders"
            exit 1
          fi
          echo "no committed secrets found"

  build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [validate, test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: chaos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that cannot run the CLI cannot be commissioned, backed up or
      # recovered. Checked here rather than discovered on the property.
      - name: Smoke-test the image
        run: |
          set -eux
          docker run --rm chaos:ci chaos --version
          docker run --rm chaos:ci chaos validate
          docker run --rm chaos:ci chaos init-db
          docker run --rm chaos:ci chaos migrate
          docker run --rm chaos:ci chaos status
          # Must run as a non-root user (SDD 15.2).
          test "$(docker run --rm chaos:ci id -u)" != "0"

      - name: Check the healthcheck responds
        run: |
          set -eux
          docker run -d --name twin-ci -e CHAOS_MQTT_ENABLED=false chaos:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' twin-ci 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs twin-ci; exit 1; }
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' twin-ci)" = "healthy"
          docker rm -f twin-ci

  # ---------------------------------------------------------------------------
  # The .NET half: the gateway, the backend supervisor, the ported API slice
  # and the desktop shell's testable core. All of it targets net10.0 and builds
  # on Linux; the WinUI 3 shell and the WiX installer skip themselves off
  # Windows (their project files say so, loudly) and are built by the release
  # machine. The build also regenerates the help site through Chaos.Runtime,
  # which is why Python is set up here as well, and the cross-implementation
  # conformance suite then runs the Python platform and Chaos.Api side by side
  # over one SQLite database - the one check that the port answers identically.
  # ---------------------------------------------------------------------------
  dotnet:
    name: .NET gateway, supervisor and shell core
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the solution
        # TreatWarningsAsErrors is set for every project, so a warning fails here.
        run: dotnet build windows/CHAOS.sln -c Release

      - name: Run the .NET tests
        run: |
          set -eux
          for project in Chaos.Host.Tests Chaos.Host.Supervisor.Tests Chaos.Api.Tests Chaos.Shell.Core.Tests; do
            dotnet test "windows/tests/$project" -c Release --no-build
          done

      - name: Install the platform for the conformance suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cross-implementation conformance (Python vs .NET)
        # The suite skips itself, loudly, on a machine that cannot run it. This
        # machine can, so a skip here is a failure: it would mean the one check
        # that the port answers identically silently stopped running.
        run: |
          set -euo pipefail
          python -m pytest tests/test_dotnet_conformance.py -q -rs | tee conformance.txt
          if grep -qE '[0-9]+ skipped' conformance.txt; then
            echo "the conformance suite skipped on a machine that has the .NET SDK"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # A merge gate like the rest. ruff is pinned: a lint job that floats to the
  # newest release fails on rules nobody changed any code to violate, and a
  # gate that fails for reasons outside the diff teaches people to ignore it.
  # `make lint` runs the same three directories.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install "ruff==0.17.1"

      - name: Lint
        run: ruff check src tests tools

      - name: Format check
        run: ruff format --check src tests tools

  # ---------------------------------------------------------------------------
  # The half that only Windows can build: the WinUI 3 shell compiles nowhere
  # else, and the installer is a Windows MSI built from a staged tree that
  # includes the embedded Python runtime. The Linux dotnet job above restores
  # the shell's package graph and skips its compile, loudly; this job is where
  # the shell is actually compiled and the installer actually produced. It
  # cannot be rehearsed off GitHub, so it proves itself only there.
  # ---------------------------------------------------------------------------
  windows:
    name: WinUI shell and installer (Windows)
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      # Chaos.Runtime regenerates the help site during the .NET build, which
      # runs tools/build_docs.py with a Python from the PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the WinUI 3 shell
        # x64 explicitly: WinUI 3 has no AnyCPU, and the installer is x64.
        run: dotnet build windows/src/Chaos.Shell/Chaos.Shell.csproj -c Release -p:Platform=x64

      - name: Publish, build the embedded runtime, stage and package the installer
        # `-Task all` = publish + stage (which builds the Python runtime from
        # python-runtime.lock.json, outbound HTTPS at build time) + package
        # (WiX 5 is installed as a pinned dotnet tool under windows/build/out).
        shell: pwsh
        run: ./windows/build/build.ps1 -Task all

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: ProjectCHAOS-msi
          path: windows/build/out/package/*.msi
          if-no-files-found: error
          retention-days: 14
