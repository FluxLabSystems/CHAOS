# Secondary control node -- physically separate from the power/battery/server
# container (SDD sections 16.1 mitigations 2 and 6, 16.2, and 49 item 6).
#
# Purpose: when the power container is lost to fire, smoke, water ingress,
# electrical fault or HVAC failure, this node must still be able to
#
#   * tell a human what happened and keep alerting,
#   * show the last known state of the property,
#   * hold a readable replica of the registry and configuration,
#   * bridge whatever MQTT traffic local controllers are still producing.
#
# It must NOT try to take over supervisory control. Local controllers keep
# subsystem authority (SDD 5.3, 16.1 mitigation 1); a second EMS racing a
# possibly-still-alive primary is a split-brain failure, not a mitigation.
#
#   docker compose -f deploy/docker-compose.secondary.yml --env-file deploy/.env up -d
#
# Open items the design package deliberately leaves unresolved for this node
# (asset it.server.secondary_control_node.01 `open_fields`):
#   host_structure, hardware, independent_power, replication_method, services.
# See docs/secondary-control-node.md.

name: chaos-secondary

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # --- Local replica database ---------------------------------------------
  # This is a *replica*, not a second source of truth. The design package marks
  # `replication_method` TBD; SDD 16.2 asks only for "replicated PostgreSQL
  # backups", so the shipped default is restore-from-backup (pull a dump with
  # deploy/backup/backup.sh, or `chaos backup` + `load-all`).
  # Streaming replication is a valid upgrade -- record the decision first.
  postgres:
    image: postgis/postgis:16-3.4
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${SECONDARY_POSTGRES_PASSWORD:?use a DIFFERENT password than the primary}
      POSTGRES_DB: ${POSTGRES_DB:-homestead}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-America/Toronto}
    volumes:
      - secondary-postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-homestead.sql:ro
    ports:
      - "${SECONDARY_BIND_ADDRESS:-127.0.0.1}:${SECONDARY_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-homestead}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- MQTT bridge (SDD 16.1 mitigation 6) --------------------------------
  # Runs a full local broker. Local controllers and gateways that can reach this
  # node keep a working bus when the primary broker is gone. The bridge block in
  # mosquitto.conf (commented out by default) forwards telemetry from the
  # primary while the primary exists, and simply fails quiet when it does not.
  mosquitto:
    image: eclipse-mosquitto:2.0
    <<: [*restart, *logging]
    environment:
      TZ: ${TZ:-America/Toronto}
      MQTT_HEALTH_USER: ${SECONDARY_MQTT_HEALTH_USER:-}
      MQTT_HEALTH_PASSWORD: ${SECONDARY_MQTT_HEALTH_PASSWORD:-}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - secondary-mosquitto-config:/mosquitto/config/local
      - secondary-mosquitto-data:/mosquitto/data
      - secondary-mosquitto-log:/mosquitto/log
    ports:
      - "${SECONDARY_BIND_ADDRESS:-127.0.0.1}:${SECONDARY_MQTT_PORT:-1883}:1883"
      - "${SECONDARY_BIND_ADDRESS:-127.0.0.1}:${SECONDARY_MQTT_TLS_PORT:-8883}:8883"
    healthcheck:
      # See the note in docker-compose.yml: an unauthenticated probe is refused
      # by a correctly configured broker, so this uses the health identity when
      # one exists and falls back to process liveness when it does not.
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${MQTT_HEALTH_USER}" ]; then
          mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3
          -u "$${MQTT_HEALTH_USER}" -P "$${MQTT_HEALTH_PASSWORD}" >/dev/null;
          else pidof mosquitto >/dev/null; fi
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- Twin core in secondary role ----------------------------------------
  twin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${TWIN_IMAGE:-chaos:local}
    <<: [*restart, *logging]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # The same pass-through as the primary stack (see docker-compose.yml and
      # tests/test_deploy_compose.py), with one rule on top: anything that is
      # a secret -- a password, a token, a stop secret -- comes from a
      # SECONDARY_* variable, because this node is a different trust subject
      # and must not share a credential with the container it exists to
      # outlive. Site-wide facts (relay host, recipients, the NetBotz
      # appliance) are shared with the primary.
      TZ: ${TZ:-America/Toronto}

      # --- Identity ---------------------------------------------------
      # runtime.build_services withholds the energy manager, command dispatch
      # and the maintenance scheduler on a secondary node: there is exactly one
      # EMS and one supervisory control source on the property.
      CHAOS_NODE_ROLE: secondary
      CHAOS_EMS_ENABLED: "false"

      # HARD-CODED, deliberately not overridable from .env.
      #
      # The platform already refuses to start command dispatch on a secondary
      # node. This flag is the second, independent layer (the broker ACL is the
      # third): a defence that lives in one branch of one Python function must
      # never be the only thing between a partitioned node and a battery.
      # Leave it false.
      CHAOS_ALLOW_PHYSICAL_CONTROL: "false"

      CHAOS_SITE_ID: ${CHAOS_SITE_ID:-site.site.primary.01}
      CHAOS_TIMEZONE: ${TZ:-America/Toronto}

      # --- Storage ----------------------------------------------------
      CHAOS_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${SECONDARY_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-homestead}
      CHAOS_SQL_ECHO: ${CHAOS_SQL_ECHO:-false}

      # --- MQTT -------------------------------------------------------
      CHAOS_MQTT_HOST: mosquitto
      CHAOS_MQTT_PORT: ${CHAOS_MQTT_PORT:-1883}
      CHAOS_MQTT_USERNAME: ${SECONDARY_MQTT_USERNAME:?set a distinct MQTT identity for the secondary node}
      CHAOS_MQTT_PASSWORD: ${SECONDARY_MQTT_PASSWORD:?set a distinct MQTT secret for the secondary node}
      CHAOS_MQTT_TLS: ${CHAOS_MQTT_TLS:-false}
      # This node's own client material, under this node's /run/secrets.
      CHAOS_MQTT_TLS_CA: ${CHAOS_MQTT_TLS_CA:-}
      CHAOS_MQTT_TLS_CERT: ${CHAOS_MQTT_TLS_CERT:-}
      CHAOS_MQTT_TLS_KEY: ${CHAOS_MQTT_TLS_KEY:-}
      CHAOS_MQTT_TLS_INSECURE: ${CHAOS_MQTT_TLS_INSECURE:-false}
      CHAOS_MQTT_CLIENT_ID: chaos-secondary
      CHAOS_MQTT_BASE_TOPIC: ${CHAOS_MQTT_BASE_TOPIC:-homestead}
      CHAOS_MQTT_ENABLED: "true"

      # --- Historian and telemetry semantics --------------------------
      CHAOS_HISTORIAN_BACKEND: sql
      # Shorter raw retention: this is a low-power node with limited storage.
      CHAOS_HISTORIAN_RAW_RETENTION_DAYS: ${SECONDARY_RAW_RETENTION_DAYS:-14}
      CHAOS_DEFAULT_STALE_AFTER_S: ${CHAOS_DEFAULT_STALE_AFTER_S:-60}

      # --- API --------------------------------------------------------
      CHAOS_API_HOST: 0.0.0.0
      CHAOS_API_PORT: 8000
      CHAOS_API_TITLE: ${CHAOS_API_TITLE:-Project CHAOS API}
      CHAOS_API_ROOT_PATH: ${CHAOS_API_ROOT_PATH:-}
      CHAOS_SUPERVISOR_STOP_SECRET: ${SECONDARY_SUPERVISOR_STOP_SECRET:-}

      # --- Overview thresholds ----------------------------------------
      CHAOS_OVERVIEW_FREEZE_RISK_C: ${CHAOS_OVERVIEW_FREEZE_RISK_C:-2.0}
      CHAOS_OVERVIEW_HEAT_RISK_C: ${CHAOS_OVERVIEW_HEAT_RISK_C:-32.0}

      # --- Control safety ---------------------------------------------
      CHAOS_COMMAND_DEFAULT_TTL_S: ${CHAOS_COMMAND_DEFAULT_TTL_S:-300}

      # --- EMS --------------------------------------------------------
      # Not running here (see CHAOS_EMS_ENABLED above); passed through so the
      # setting set is the same on both nodes.
      CHAOS_EMS_TICK_INTERVAL_S: ${CHAOS_EMS_TICK_INTERVAL_S:-5}

      # --- Alarms and notification ------------------------------------
      # Alarms and notification are the point of this node (SDD 16.1
      # mitigation 4: essential alerts can originate independently). The relay
      # and the recipients are site-wide; the relay credential and the push
      # token are this node's own.
      CHAOS_ALARM_ENGINE_ENABLED: "true"
      CHAOS_NOTIFICATION_BACKENDS: ${SECONDARY_NOTIFICATION_BACKENDS:-log}
      CHAOS_NOTIFY_EMAIL_RECIPIENTS: ${CHAOS_NOTIFY_EMAIL_RECIPIENTS:-}
      CHAOS_NOTIFY_PUSH_TARGETS: ${CHAOS_NOTIFY_PUSH_TARGETS:-}
      CHAOS_NOTIFY_SMTP_HOST: ${CHAOS_NOTIFY_SMTP_HOST:-}
      CHAOS_NOTIFY_SMTP_PORT: ${CHAOS_NOTIFY_SMTP_PORT:-587}
      CHAOS_NOTIFY_SMTP_SECURITY: ${CHAOS_NOTIFY_SMTP_SECURITY:-starttls}
      CHAOS_NOTIFY_SMTP_USERNAME: ${SECONDARY_NOTIFY_SMTP_USERNAME:-}
      CHAOS_NOTIFY_SMTP_PASSWORD: ${SECONDARY_NOTIFY_SMTP_PASSWORD:-}
      CHAOS_NOTIFY_SMTP_FROM: ${CHAOS_NOTIFY_SMTP_FROM:-}
      CHAOS_NOTIFY_SMTP_TIMEOUT_S: ${CHAOS_NOTIFY_SMTP_TIMEOUT_S:-10.0}
      CHAOS_NOTIFY_PUSH_URL: ${CHAOS_NOTIFY_PUSH_URL:-}
      CHAOS_NOTIFY_PUSH_TOKEN: ${SECONDARY_NOTIFY_PUSH_TOKEN:-}
      CHAOS_NOTIFY_PUSH_TIMEOUT_S: ${CHAOS_NOTIFY_PUSH_TIMEOUT_S:-10.0}
      CHAOS_NOTIFY_RETRY_LIMIT: ${CHAOS_NOTIFY_RETRY_LIMIT:-3}
      CHAOS_NOTIFY_RETRY_INTERVAL_S: ${CHAOS_NOTIFY_RETRY_INTERVAL_S:-300}

      # --- Backups and self-monitoring --------------------------------
      # `chaos backup` on this node writes into its own volume. The backup-age
      # monitor does not run here (it describes the primary's backups), and
      # the register has no asset for this node's API service yet, so no
      # availability is announced until SECONDARY_PLATFORM_ASSET_ID names one.
      CHAOS_BACKUP_DIRECTORY: ${SECONDARY_BACKUP_DIRECTORY:-/app/var/backups}
      CHAOS_BACKUP_AGE_ASSET_ID: ${CHAOS_BACKUP_AGE_ASSET_ID:-it.application_service.rack_01.postgres_01}
      CHAOS_PLATFORM_ASSET_ID: ${SECONDARY_PLATFORM_ASSET_ID:-}

      # --- Plugins ----------------------------------------------------
      # A plugin loads here only if its manifest names the secondary role.
      # Environmental monitoring does: the NetBotz 500 is mounted in the power
      # container this node exists to outlive (SDD 16.1). The appliance is the
      # same one the primary reads; the account used to read it is this node's.
      CHAOS_PLUGINS_ENABLED: ${SECONDARY_PLUGINS_ENABLED:-*}
      CHAOS_PLUGINS_DISABLED: ${SECONDARY_PLUGINS_DISABLED:-}
      CHAOS_PLUGIN_OPTIONS: ${SECONDARY_PLUGIN_OPTIONS:-}
      CHAOS_PLUGIN_MIRROR_ENABLED: ${SECONDARY_PLUGIN_MIRROR_ENABLED:-true}
      CHAOS_PLUGIN_NETBOTZ_TRANSPORT: ${CHAOS_PLUGIN_NETBOTZ_TRANSPORT:-none}
      CHAOS_PLUGIN_NETBOTZ_HOST: ${CHAOS_PLUGIN_NETBOTZ_HOST:-}
      CHAOS_PLUGIN_NETBOTZ_USERNAME: ${SECONDARY_PLUGIN_NETBOTZ_USERNAME:-}
      CHAOS_PLUGIN_NETBOTZ_PASSWORD: ${SECONDARY_PLUGIN_NETBOTZ_PASSWORD:-}
      CHAOS_PLUGIN_NETBOTZ_CA_FILE: ${CHAOS_PLUGIN_NETBOTZ_CA_FILE:-}
      CHAOS_PLUGIN_NETBOTZ_READINGS_PATH: ${CHAOS_PLUGIN_NETBOTZ_READINGS_PATH:-}
      CHAOS_PLUGIN_NETBOTZ_ENCLOSURE_ID: ${CHAOS_PLUGIN_NETBOTZ_ENCLOSURE_ID:-}
      CHAOS_PLUGIN_NETBOTZ_POLL_INTERVAL_S: ${CHAOS_PLUGIN_NETBOTZ_POLL_INTERVAL_S:-30}
    volumes:
      - secondary-twin-var:/app/var
      # This node's own certificate material (its client certificate differs
      # from the primary's), mounted read-only. See docker-compose.yml.
      - ${SECRETS_DIR:-./secrets}:/run/secrets:ro
    ports:
      - "${SECONDARY_BIND_ADDRESS:-127.0.0.1}:${SECONDARY_TWIN_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # --- Reduced read-only dashboard (SDD 16.1 mitigation 6) ----------------
  # Deliberately no Prometheus here: the exporters it scrapes live in the rack
  # that this node exists to survive. The energy dashboard reads the local
  # PostgreSQL replica, which is the only data source that stays meaningful.
  grafana:
    image: grafana/grafana:11.1.0
    <<: [*restart, *logging]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Toronto}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SECONDARY_GRAFANA_ADMIN_PASSWORD:?set SECONDARY_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      CHAOS_PG_HOST: postgres:5432
      CHAOS_PG_DB: ${POSTGRES_DB:-homestead}
      CHAOS_PG_USER: ${POSTGRES_USER}
      CHAOS_PG_PASSWORD: ${SECONDARY_POSTGRES_PASSWORD}
      # No Prometheus on this node; the provisioned datasource is marked
      # optional and will simply report unreachable.
      CHAOS_PROMETHEUS_URL: ${SECONDARY_PROMETHEUS_URL:-http://prometheus.invalid:9090}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - secondary-grafana-data:/var/lib/grafana
    ports:
      - "${SECONDARY_BIND_ADDRESS:-127.0.0.1}:${SECONDARY_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  secondary-postgres-data:
  secondary-mosquitto-config:
  secondary-mosquitto-data:
  secondary-mosquitto-log:
  secondary-twin-var:
  secondary-grafana-data:

networks:
  default:
    name: chaos-secondary
